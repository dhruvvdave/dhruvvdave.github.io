<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DD monogram">
  <defs>
    <linearGradient id="dd" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2160d8"/>
      <stop offset="1" stop-color="#56a5f5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="#0f1216"/>
  <!-- Back D: up and to the left -->
  <path fill="url(#dd)" fill-rule="evenodd"
        d="M12 10 L23 10 A17 17 0 0 1 23 44 L12 44 Z
           M19 17 L23 17 A10 10 0 0 1 23 37 L19 37 Z"/>
  <!-- Dark plate: separates the bowls where they cross, so the interlock
       still reads once the mark is scaled down to 16px. -->
  <path fill="#0f1216" stroke="#0f1216" stroke-width="3.5"
        d="M24 20 L37 20 A17 17 0 0 1 37 54 L24 54 Z"/>
  <!-- Front D: down and to the right -->
  <path fill="url(#dd)" fill-rule="evenodd"
        d="M24 20 L37 20 A17 17 0 0 1 37 54 L24 54 Z
           M31 27 L37 27 A10 10 0 0 1 37 47 L31 47 Z"/>
</svg>
